<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分組系統 | 班經小工具</title>
  <style>
    :root{--ink:#f3f7ff;--muted:#a9b4c7;--line:rgba(232,238,255,.16);--cyan:#00f5d4;--green:#b8ff33;--rose:#ff2e88;--radius:8px;font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{height:100dvh;margin:0;color:var(--ink);background:radial-gradient(circle at 12% 0%,rgba(0,245,212,.18),transparent 24rem),radial-gradient(circle at 90% 10%,rgba(255,46,136,.18),transparent 28rem),linear-gradient(135deg,#03040a,#080b12 45%,#11151f)}a{color:inherit;text-decoration:none}button,input{font:inherit}.page{width:min(1260px,calc(100% - 20px));height:100dvh;margin:0 auto;padding:10px 0;display:grid;grid-template-rows:auto auto 1fr;gap:8px}.glass{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.035)),rgba(8,11,19,.66);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 24px 70px rgba(0,0,0,.42);backdrop-filter:blur(24px) saturate(165%)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px}.topbar h1{margin:0;font-size:1.2rem}.topbar p{margin:2px 0 0;color:var(--muted);font-size:.9rem}.nav{display:flex;gap:8px}.nav a,.btn{min-height:36px;padding:0 11px;border:1px solid rgba(232,238,255,.18);border-radius:var(--radius);background:rgba(255,255,255,.08);color:var(--ink);font-weight:850;cursor:pointer}.btn.primary{border-color:rgba(0,245,212,.42);background:linear-gradient(145deg,rgba(0,245,212,.28),rgba(53,167,255,.14))}.toolbar{display:grid;grid-template-columns:1.4fr .8fr 90px auto auto auto;gap:8px;padding:10px}.field{display:grid;gap:4px;color:#dce7ff;font-size:.86rem;font-weight:850}input{width:100%;padding:8px 10px;border:1px solid rgba(232,238,255,.16);border-radius:var(--radius);background:rgba(2,6,23,.56);color:var(--ink)}.layout{min-height:0;display:grid;grid-template-columns:310px 1fr;gap:8px}.pool,.groups{min-height:0;padding:10px;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px}.pool h2,.groups h2{margin:0;font-size:1.05rem}.hint{margin:0;color:var(--muted);font-size:.88rem;line-height:1.4}.student-list,.group-grid{min-height:0;overflow:auto}.student-list{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;padding:8px;border:1px dashed rgba(232,238,255,.2);border-radius:var(--radius);background:rgba(0,0,0,.12)}.student{display:inline-flex;align-items:center;justify-content:center;min-width:52px;min-height:38px;padding:7px 10px;border:1px solid rgba(232,238,255,.18);border-radius:999px;background:rgba(0,245,212,.12);color:#efffff;font-weight:900;cursor:grab}.student.selected{border-color:var(--green);background:rgba(184,255,51,.22);box-shadow:0 0 22px rgba(184,255,51,.24)}.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.group{min-height:128px;padding:9px;border:1px solid rgba(232,238,255,.15);border-radius:var(--radius);background:rgba(255,255,255,.06);cursor:pointer}.group.over,.student-list.over{border-color:var(--green);box-shadow:0 0 26px rgba(184,255,51,.2)}.group h3{margin:0 0 7px;color:var(--cyan);font-size:1rem}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:980px){.page{width:calc(100% - 16px);grid-template-rows:auto auto 1fr}.topbar p{display:none}.toolbar{grid-template-columns:1fr 1fr 82px}.toolbar .btn{min-height:34px}.layout{grid-template-columns:250px 1fr}.group-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.student{min-width:46px;min-height:34px;padding:5px 8px}}@media(max-width:700px){.layout{grid-template-columns:1fr;grid-template-rows:40% 60%}.toolbar{grid-template-columns:1fr 1fr}.nav a,.btn{padding:0 8px}}
  </style>
</head>
<body>
<main class="page">
  <header class="topbar glass"><div><h1>分組系統</h1><p>可拖拉，也可點學生再點組。全頁不需捲動。</p></div><nav class="nav"><a href="./class-tools.html">工具入口</a><a href="./index.html">首頁</a></nav></header>
  <section class="toolbar glass">
    <label class="field">座號範圍/名單<input id="source" value="1-30"></label>
    <label class="field">排除座號<input id="exclude" placeholder="例如 3, 11"></label>
    <label class="field">組數<input id="groupCount" type="number" min="1" value="5"></label>
    <button class="btn primary" id="build">建立</button><button class="btn" id="auto">自動分</button><button class="btn" id="copy">複製</button>
  </section>
  <section class="layout">
    <aside class="pool glass"><h2>學生池</h2><p class="hint" id="hint">拖拉，或先點學生再點右邊組別。</p><div class="student-list" id="pool"></div><div class="actions"><button class="btn" id="backAll">全部放回</button></div></aside>
    <section class="groups glass"><h2>分組區</h2><p class="hint">各組人數可手動微調。</p><div class="group-grid" id="groups"></div><div></div></section>
  </section>
</main>
<script>
  let dragged=null,selected=null;function exSet(){return new Set(exclude.value.split(/,|，|\s+/).map(Number).filter(Boolean))}function parseNames(){const v=source.value.trim(),m=v.match(/^(\d+)\s*-\s*(\d+)$/),ex=exSet();if(m){const a=+m[1],b=+m[2];return Array.from({length:b-a+1},(_,i)=>a+i).filter(n=>!ex.has(n)).map(n=>`${n}號`)}return v.split(/\n|,|，/).map(x=>x.trim()).filter(Boolean).filter(x=>!ex.has(parseInt(x)))}
  function selectCard(el){document.querySelectorAll(".student").forEach(s=>s.classList.remove("selected"));selected=selected===el?null:el;if(selected){selected.classList.add("selected");hint.textContent=`已選 ${selected.textContent}，點右邊組別放入。`}else hint.textContent="拖拉，或先點學生再點右邊組別。"}function card(name){const el=document.createElement("button");el.type="button";el.className="student";el.textContent=name;el.draggable=true;el.addEventListener("dragstart",()=>dragged=el);el.addEventListener("dragend",()=>dragged=null);return el}
  function makeDrop(zone){zone.addEventListener("click",()=>{if(selected){zone.append(selected);selectCard(selected)}});zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over")});zone.addEventListener("dragleave",()=>zone.classList.remove("over"));zone.addEventListener("drop",e=>{e.preventDefault();zone.classList.remove("over");if(dragged)zone.append(dragged)})}
  function buildBoard(){pool.innerHTML="";groups.innerHTML="";parseNames().forEach(n=>pool.append(card(n)));for(let i=1;i<=+groupCount.value;i++){const g=document.createElement("article");g.className="group";g.innerHTML=`<h3>第 ${i} 組</h3>`;makeDrop(g);groups.append(g)}makeDrop(pool)}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}document.addEventListener("click",e=>{const s=e.target.closest(".student");if(s)selectCard(s)});build.onclick=buildBoard;auto.onclick=()=>{const cards=shuffle([...document.querySelectorAll(".student")]),zones=[...document.querySelectorAll(".group")];cards.forEach((c,i)=>zones[i%zones.length].append(c))};backAll.onclick=()=>document.querySelectorAll(".student").forEach(c=>pool.append(c));copy.onclick=()=>navigator.clipboard?.writeText([...document.querySelectorAll(".group")].map((g,i)=>`第 ${i+1} 組：${[...g.querySelectorAll(".student")].map(s=>s.textContent).join("、")}`).join("\n"));buildBoard();
</script>
</body>
</html>

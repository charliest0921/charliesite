<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外務登記系統 | 班經小工具</title>
  <style>
    :root{--ink:#f3f7ff;--muted:#a9b4c7;--line:rgba(232,238,255,.16);--cyan:#00f5d4;--blue:#35a7ff;--green:#b8ff33;--amber:#ffb000;--rose:#ff2e88;--radius:8px;font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{height:100dvh;margin:0;color:var(--ink);background:radial-gradient(circle at 12% 0%,rgba(0,245,212,.18),transparent 24rem),radial-gradient(circle at 90% 10%,rgba(255,46,136,.18),transparent 28rem),linear-gradient(135deg,#03040a,#080b12 45%,#11151f)}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
    a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.page{width:min(1280px,calc(100% - 14px));height:100dvh;margin:0 auto;padding:7px 0;display:grid;grid-template-rows:auto 1fr;gap:7px}.glass{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.035)),rgba(8,11,19,.66);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 24px 70px rgba(0,0,0,.42);backdrop-filter:blur(24px) saturate(165%)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px}.topbar h1{margin:0;font-size:1.08rem}.topbar p{margin:1px 0 0;color:var(--muted);font-size:.8rem}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.btn,.choice{min-height:28px;padding:0 8px;border:1px solid rgba(232,238,255,.18);border-radius:var(--radius);background:rgba(255,255,255,.08);color:var(--ink);font-weight:850;cursor:pointer}.btn.primary,.choice.active{border-color:rgba(0,245,212,.42);background:linear-gradient(145deg,rgba(0,245,212,.28),rgba(53,167,255,.14));box-shadow:0 0 22px rgba(0,245,212,.15)}.btn.danger{border-color:rgba(255,46,136,.42);color:#ffd5e6}
    .layout{min-height:0;display:grid;grid-template-columns:minmax(430px,.74fr) minmax(0,1.26fr);gap:7px}.left{min-height:0;display:grid;grid-template-rows:82px 1fr auto;gap:7px}.panel{min-height:0;padding:8px}.panel h2{margin:0 0 4px;font-size:.9rem}.clock{display:grid;align-content:center;text-align:left;padding:10px}.date{color:#9eefff;font-weight:900;font-size:.9rem}.time{font-size:clamp(2.25rem,4.6vw,3.8rem);font-weight:950;line-height:.9;text-shadow:0 0 34px rgba(53,167,255,.35);white-space:nowrap}
    .work{display:grid;grid-template-rows:auto minmax(0,.52fr) 31px auto minmax(0,1fr);gap:5px}.task-grid{min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(24px,1fr);gap:4px}.seat-block{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:4px}.seat-grid{min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(24px,1fr);gap:4px}.choice{padding:0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem}.seat.active{border-color:rgba(184,255,51,.6);background:linear-gradient(145deg,rgba(184,255,51,.26),rgba(0,245,212,.12))}.edit-box{display:grid;grid-template-columns:1fr auto;gap:5px}.edit-box textarea{height:31px;resize:none;line-height:1.05;font-size:.8rem}.fields{display:grid;grid-template-columns:72px 1fr auto auto;gap:5px;align-items:end}.field{display:grid;gap:2px;color:#dce7ff;font-size:.72rem;font-weight:850}input,textarea{width:100%;padding:5px 7px;border:1px solid rgba(232,238,255,.16);border-radius:var(--radius);background:rgba(2,6,23,.56);color:var(--ink)}.actions{display:flex;gap:5px;flex-wrap:wrap}.summary{color:#aab6c9;line-height:1.18;font-size:.76rem;margin:4px 0 0}
    .result{min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:6px;padding:9px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.result-head h2{margin:0;font-size:1.08rem}.big-count{color:#9ffff0;font-weight:950;font-size:.92rem}.records{min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(82px,auto);align-content:start;gap:6px}.group-card{min-height:0;padding:8px;border:1px solid rgba(232,238,255,.14);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));box-shadow:0 12px 26px rgba(0,0,0,.2);overflow:hidden}.group-head{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:5px}.group-head strong{font-size:1rem;color:#f8fbff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini{color:#aab6c9;font-size:.76rem;line-height:1.25}.seat-chips{display:flex;gap:4px;flex-wrap:wrap}.seat-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 5px;border-radius:999px;background:rgba(0,245,212,.14);border:1px solid rgba(0,245,212,.18);font-weight:950;color:#dffffa;font-size:.8rem}.seat-chip .btn{min-height:20px;padding:0 5px;font-size:.68rem}.empty{height:100%;display:grid;place-items:center;color:#8fa1bd;font-size:1.1rem;font-weight:900;text-align:center;grid-column:1/-1}.result-actions{border-top:1px solid rgba(232,238,255,.12);padding-top:6px}
    @media(max-width:980px){.page{width:calc(100% - 12px)}.layout{grid-template-columns:1fr;grid-template-rows:1fr 34vh}.left{grid-template-columns:176px 1fr;grid-template-rows:1fr auto}.clock{grid-row:1/3}.work{grid-template-rows:auto minmax(0,.55fr) 28px auto minmax(0,1fr)}.task-grid{grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(22px,1fr)}.seat-grid{grid-template-columns:repeat(10,1fr);grid-auto-rows:minmax(24px,1fr)}.records{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(68px,auto)}.result{padding:8px}.topbar p{display:none}.time{font-size:2.45rem}.fields{grid-template-columns:68px 1fr auto auto}.nav a,.btn,.choice{font-size:.78rem;min-height:26px;padding:0 6px}.mini{font-size:.7rem}.seat-chip{font-size:.72rem;padding:3px 4px}}@media(max-width:720px){.layout{grid-template-rows:1fr 38vh}.left{grid-template-columns:1fr;grid-template-rows:64px 1fr auto}.clock{grid-row:auto}.date{display:none}.time{font-size:2rem}.task-grid{grid-template-columns:repeat(4,1fr)}.seat-grid{grid-template-columns:repeat(6,1fr)}.records{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(62px,auto)}.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:1/-1}.fields .btn{grid-column:auto}.edit-box{grid-template-columns:1fr auto}}
  </style>
</head>
<body>
<main class="page">
  <header class="topbar glass"><div><h1>外務登記</h1><p>左上顯示時間；左側下方操作；右側集中呈現目前外務。</p></div><nav class="nav"><a href="./class-tools.html">工具入口</a><a href="./index.html">首頁</a></nav></header>
  <section class="layout">
    <div class="left">
      <section class="clock glass"><div><div class="date" id="date">--</div><div class="time" id="time">--:--:--</div></div></section>
      <section class="panel glass work">
        <h2>1. 選外務</h2>
        <div class="task-grid" id="taskGrid"></div>
        <div class="edit-box"><textarea id="taskEditor" aria-label="外務清單"></textarea><button class="btn" id="saveTasks">儲存外務</button></div>
        <h2>2. 選座號</h2>
        <div class="seat-block">
          <div class="fields"><label class="field">座號到<input id="maxNo" type="number" min="1" max="60" value="30"></label><label class="field wide">排除座號<input id="exclude" placeholder="例如 11, 28"></label><button class="btn" id="buildSeats">套用</button><button class="btn" id="clearSeats">清除</button></div>
          <div class="seat-grid" id="seatGrid"></div>
        </div>
      </section>
      <section class="panel glass">
        <div class="fields"><label class="field">預估分鐘<input id="mins" type="number" min="0" value="0"></label><label class="field wide">備註<input id="note" placeholder="例如：拿資料、協助搬物品。"></label><button class="btn primary" id="add">登記</button><button class="btn danger" id="clearAll">清空</button></div>
        <p class="summary" id="summary">請先選外務與座號。</p>
      </section>
    </div>
    <section class="result glass">
      <div class="result-head"><h2>目前外務登記</h2><span class="big-count" id="activeCount">0 人外出中</span></div>
      <div class="records" id="list"></div>
      <div class="result-actions actions"><button class="btn" id="markReturn">選取座號返回</button><button class="btn" id="copy">複製目前狀態</button></div>
    </section>
  </section>
</main>
<script>
  const taskKey="charlie-errand-tasks-v3",stateKey="charlie-errand-settings-v3";
  let tasks=["交作業","拿教具","健康中心","廁所","圖書館","輔導室","學務處","總務處","搬物品","其他任務"],selectedTask="",selectedSeats=new Set(),records=[];
  const $=id=>document.getElementById(id), now=()=>new Date().toLocaleTimeString("zh-Hant-TW",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
  function saveState(){localStorage.setItem(stateKey,JSON.stringify({maxNo:$("maxNo").value,exclude:$("exclude").value}))}
  function load(){try{tasks=JSON.parse(localStorage.getItem(taskKey)||"null")||tasks}catch{}try{const s=JSON.parse(localStorage.getItem(stateKey)||"{}");$("maxNo").value=s.maxNo||30;$("exclude").value=s.exclude||""}catch{}}
  function exSet(){return new Set($("exclude").value.split(/,|，|\s+/).map(Number).filter(Boolean))}
  function renderTasks(){if(!selectedTask||!tasks.includes(selectedTask))selectedTask=tasks[0]||"";$("taskEditor").value=tasks.join("\n");$("taskGrid").innerHTML=tasks.map(t=>`<button class="choice ${t===selectedTask?"active":""}" data-task="${t}" title="${t}">${t}</button>`).join("");document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{selectedTask=b.dataset.task;renderTasks();updateSummary()})}
  function renderSeats(){const ex=exSet();const seats=Array.from({length:Number($("maxNo").value)||30},(_,i)=>i+1).filter(n=>!ex.has(n));selectedSeats=new Set([...selectedSeats].filter(n=>seats.includes(n)));$("seatGrid").innerHTML=seats.map(n=>`<button class="choice seat ${selectedSeats.has(n)?"active":""}" data-seat="${n}">${n}</button>`).join("");document.querySelectorAll("[data-seat]").forEach(b=>b.onclick=()=>{const n=Number(b.dataset.seat);selectedSeats.has(n)?selectedSeats.delete(n):selectedSeats.add(n);renderSeats();updateSummary()});saveState()}
  function spent(t){return Math.floor((Date.now()-t)/60000)}
  function updateSummary(){const seats=[...selectedSeats].sort((a,b)=>a-b).map(n=>`${n}號`).join("、")||"未選";$("summary").textContent=`外務：${selectedTask||"未選"}；座號：${seats}；預估：${Number($("mins").value)||0} 分鐘`}
  function grouped(){const active=records.filter(r=>!r.done);const map=new Map();active.forEach(r=>{if(!map.has(r.task))map.set(r.task,[]);map.get(r.task).push(r)});return [...map.entries()]}
  function renderRecords(){const groups=grouped(),total=groups.reduce((n,[,items])=>n+items.length,0);$("activeCount").textContent=`${total} 人外出中`;$("list").innerHTML=groups.length?groups.map(([task,items])=>`<article class="group-card"><div class="group-head"><strong>${task}</strong><span class="mini">${items.length} 人</span></div><div class="seat-chips">${items.sort((a,b)=>a.seat-b.seat).map(r=>`<span class="seat-chip">${r.seat}號 <button class="btn" data-back="${r.id}">返回</button></span>`).join("")}</div><p class="mini">${items.map(r=>`${r.seat}號：出發 ${r.startText}，已 ${spent(r.start)} 分鐘${r.mins>0?`，預估 ${r.mins} 分鐘`:"，無預估"}${r.note?`，${r.note}`:""}`).join("<br>")}</p></article>`).join(""):`<div class="empty">目前沒有外務登記</div>`;document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{const r=records.find(x=>x.id===b.dataset.back);if(r)r.done=true;renderRecords()});window.errandText=groups.length?groups.map(([task,items])=>`${task}：${items.sort((a,b)=>a.seat-b.seat).map(r=>`${r.seat}號，出發 ${r.startText}，已 ${spent(r.start)} 分鐘${r.mins>0?`，預估 ${r.mins} 分鐘`:"，無預估"}${r.note?`，${r.note}`:""}`).join("；")}`).join("\n"):"目前無外務登記。"}
  $("saveTasks").onclick=()=>{tasks=$("taskEditor").value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,40);localStorage.setItem(taskKey,JSON.stringify(tasks));renderTasks();updateSummary()};
  $("buildSeats").onclick=renderSeats;$("clearSeats").onclick=()=>{selectedSeats.clear();renderSeats();updateSummary()};["maxNo","exclude","mins"].forEach(id=>$(id).addEventListener("input",()=>{if(id!=="mins")renderSeats();updateSummary()}));
  $("add").onclick=()=>{if(!selectedTask||!selectedSeats.size){updateSummary();return}const stamp=Date.now();[...selectedSeats].forEach(seat=>records.unshift({id:`${stamp}-${seat}-${Math.random()}`,task:selectedTask,seat,mins:Number($("mins").value)||0,note:$("note").value.trim(),start:stamp,startText:now(),done:false}));$("note").value="";selectedSeats.clear();renderSeats();renderRecords();updateSummary()};
  $("markReturn").onclick=()=>{const seats=new Set(selectedSeats);records.forEach(r=>{if(seats.has(r.seat))r.done=true});selectedSeats.clear();renderSeats();renderRecords();updateSummary()};$("clearAll").onclick=()=>{records=[];renderRecords()};$("copy").onclick=()=>navigator.clipboard?.writeText(window.errandText||"目前無外務登記。");
  function tick(){const d=new Date();$("time").textContent=d.toLocaleTimeString("zh-Hant-TW",{hour12:false});$("date").textContent=d.toLocaleDateString("zh-Hant-TW",{weekday:"long",year:"numeric",month:"long",day:"numeric"});renderRecords()}load();renderTasks();renderSeats();updateSummary();renderRecords();setInterval(tick,1000);tick();
</script>
</body>
</html>

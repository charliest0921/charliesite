<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>萬用鐘 | 班經小工具</title>
  <style>
    :root{--ink:#f3f7ff;--muted:#a9b4c7;--line:rgba(232,238,255,.16);--cyan:#00f5d4;--blue:#35a7ff;--green:#b8ff33;--amber:#ffb000;--rose:#ff2e88;--radius:8px;font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{height:100dvh;margin:0;color:var(--ink);background:radial-gradient(circle at 12% 0%,rgba(0,245,212,.18),transparent 24rem),radial-gradient(circle at 90% 10%,rgba(255,46,136,.18),transparent 28rem),linear-gradient(135deg,#03040a,#080b12 45%,#11151f)}body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
    a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.page{width:min(1280px,calc(100% - 20px));height:100dvh;margin:0 auto;padding:10px 0;display:grid;grid-template-rows:auto auto 1fr;gap:8px}.glass{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.035)),rgba(8,11,19,.66);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 24px 70px rgba(0,0,0,.42);backdrop-filter:blur(24px) saturate(165%)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px}.topbar h1{margin:0;font-size:1.2rem}.topbar p{margin:2px 0 0;color:var(--muted);font-size:.9rem}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.tab,.btn{min-height:38px;padding:0 12px;border:1px solid rgba(232,238,255,.18);border-radius:var(--radius);background:rgba(255,255,255,.08);color:var(--ink);font-weight:850;cursor:pointer}.tab.active,.btn.primary{border-color:rgba(0,245,212,.42);background:linear-gradient(145deg,rgba(0,245,212,.28),rgba(53,167,255,.14));box-shadow:0 0 22px rgba(0,245,212,.15)}.btn.danger{border-color:rgba(255,46,136,.42);color:#ffd5e6}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.layout{min-height:0;display:grid;grid-template-columns:minmax(280px,.82fr) minmax(360px,1.18fr);gap:10px}.side{min-height:0;padding:12px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:8px}.side h2{margin:0;font-size:1.05rem}.side p{display:none}.field{display:grid;gap:6px;margin:0;color:#dce7ff;font-weight:850}input,textarea{width:100%;padding:10px;border:1px solid rgba(232,238,255,.16);border-radius:var(--radius);background:rgba(2,6,23,.56);color:var(--ink)}textarea{min-height:0;height:100%;resize:none;line-height:1.28;font-size:var(--note-size,1.75rem)}.note-tools{display:flex;gap:6px}.note-tools .btn{min-height:30px;padding:0 9px;font-size:.86rem}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0}
    .stage{position:relative;overflow:hidden;display:grid;place-items:center;min-height:0;padding:18px;text-align:center}.stage.warning{animation:pulse 900ms infinite}.stage.danger{animation:flash 240ms infinite}.digital{font-size:min(12vw,18vh,8.8rem);font-weight:950;line-height:.9;letter-spacing:0;white-space:nowrap;text-shadow:0 0 38px rgba(53,167,255,.38)}.sub{margin-top:12px;color:#c3d0e6;font-size:min(2.8vw,1.35rem);font-weight:850}.analog{position:relative;margin:0 auto 16px;width:min(26vw,28vh,240px);height:min(26vw,28vh,240px);min-width:150px;min-height:150px;border:2px solid rgba(232,238,255,.22);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,.03));box-shadow:inset 0 0 36px rgba(0,245,212,.12),0 0 50px rgba(0,245,212,.14)}.hand{position:absolute;left:50%;top:50%;width:4px;transform-origin:50% 100%;border-radius:99px;background:var(--cyan)}.hour{height:25%;margin-top:-25%}.minute{height:34%;margin-top:-34%;background:var(--blue)}.second{height:39%;margin-top:-39%;width:2px;background:var(--rose)}.dot{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--green);box-shadow:0 0 22px var(--green)}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hidden{display:none!important}
    @keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 30px rgba(255,176,0,.3),0 24px 70px rgba(0,0,0,.42)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 80px rgba(255,176,0,.75),0 24px 70px rgba(0,0,0,.42)}}@keyframes flash{0%,100%{background:rgba(255,46,136,.34)}50%{background:rgba(0,245,212,.25)}}
    @media(max-width:920px){.page{width:calc(100% - 16px);padding:8px 0}.layout{grid-template-columns:1fr;grid-template-rows:.8fr 1fr}.topbar p{display:none}.digital{font-size:min(17vw,13vh,7rem)}.analog{width:min(28vw,18vh,180px);height:min(28vw,18vh,180px);min-width:120px;min-height:120px}.side{grid-template-rows:auto auto 1fr auto auto}.nav a,.tab,.btn{min-height:34px;padding:0 8px}.tabs{gap:6px}}@media(max-width:560px){.controls{grid-template-columns:1fr}.nav a{width:100%;text-align:center}.tabs{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="page">
  <header class="topbar glass"><div><h1>萬用鐘</h1><p>左側提醒，右側時間。投影與平板都能清楚使用。</p></div><nav class="nav"><a href="./class-tools.html">工具入口</a><a href="./index.html">首頁</a></nav></header>
  <div class="tabs" aria-label="模式切換"><button class="tab active" data-mode="clock">大時鐘</button><button class="tab" data-mode="end">終點倒數</button><button class="tab" data-mode="timer">分鐘鬧鐘</button><button class="tab" data-mode="stopwatch">碼表</button></div>
  <section class="layout">
    <aside class="side glass">
      <h2>提醒文字</h2><p>輸入要投影給全班看的提醒，可依情境調整字體大小。</p>
      <div class="note-tools"><button class="btn" data-note-size="1.35rem">小</button><button class="btn primary" data-note-size="1.75rem">中</button><button class="btn" data-note-size="2.25rem">大</button></div>
      <textarea id="notice" placeholder="例如：下課前完成閱讀單，完成後交到第一排桌上。"></textarea>
      <div class="controls">
        <label class="field end-input hidden">終點時間<input id="endTime" type="time"></label>
        <label class="field timer-input hidden">幾分鐘後提醒<input id="timerMinutes" type="number" min="1" value="5"></label>
      </div>
      <div class="actions"><button class="btn primary" id="startBtn">開始</button><button class="btn" id="pauseBtn">暫停</button><button class="btn danger" id="resetBtn">重設</button></div>
      <p class="sub" id="status">大時鐘模式會顯示類比三指針。</p>
    </aside>
    <section class="stage glass" id="stage">
      <div>
        <div class="analog" id="analog"><span class="hand hour" id="hourHand"></span><span class="hand minute" id="minuteHand"></span><span class="hand second" id="secondHand"></span><span class="dot"></span></div>
        <div class="digital" id="digital">--:--:--</div>
        <div class="sub" id="sub">24 小時制</div>
      </div>
    </section>
  </section>
</main>
<script>
  let mode="clock", running=false, target=0, elapsed=0, last=Date.now(), audio;
  const $=id=>document.getElementById(id), pad=n=>String(Math.floor(n)).padStart(2,"0"), fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return`${pad(s/3600)}:${pad((s%3600)/60)}:${pad(s%60)}`};
  function unlock(){audio=audio||new (window.AudioContext||window.webkitAudioContext)()}function beep(f=880,d=100){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.08,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d/1000);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d/1000)}
  function setMode(m){mode=m;running=false;elapsed=0;$("stage").className="stage glass";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));$("analog").classList.toggle("hidden",m!=="clock");document.querySelector(".end-input").classList.toggle("hidden",m!=="end");document.querySelector(".timer-input").classList.toggle("hidden",m!=="timer");$("status").textContent={clock:"大時鐘模式會顯示類比三指針。",end:"設定幾點幾分為終點，開始後倒數。",timer:"設定幾分鐘後響鈴提醒。",stopwatch:"碼表可開始、暫停與重設。"}[m]}
  function start(){unlock();running=true;last=Date.now();$("stage").className="stage glass";if(mode==="end"){const v=$("endTime").value;if(!v){$("status").textContent="請先選終點時間。";running=false;return}const [h,m]=v.split(":").map(Number),t=new Date();t.setHours(h,m,0,0);if(t<Date.now())t.setDate(t.getDate()+1);target=t.getTime()}if(mode==="timer")target=Date.now()+(Number($("timerMinutes").value)||1)*60000}
  function tick(){const n=new Date(),ms=n.getTime();$("hourHand").style.transform=`rotate(${(n.getHours()%12)*30+n.getMinutes()/2}deg)`;$("minuteHand").style.transform=`rotate(${n.getMinutes()*6+n.getSeconds()/10}deg)`;$("secondHand").style.transform=`rotate(${n.getSeconds()*6}deg)`;if(mode==="clock"){$("digital").textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;$("sub").textContent=n.toLocaleDateString("zh-Hant-TW",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}if((mode==="end"||mode==="timer")&&running){const left=target-ms;$("digital").textContent=fmt(left);$("sub").textContent=left>0?"倒數進行中":"時間到";if(left<=60000&&left>10000){$("stage").className="stage glass warning";if(n.getSeconds()%2===0)beep(680,80)}if(left<=10000&&left>0){$("stage").className="stage glass danger";beep(1220,75)}if(left<=0){running=false;$("stage").className="stage glass danger";beep(440,520)}}if(mode==="stopwatch"){if(running){elapsed+=ms-last;last=ms}$("digital").textContent=fmt(elapsed);$("sub").textContent=running?"碼表計時中":"碼表暫停"}requestAnimationFrame(tick)}
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll("[data-note-size]").forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty("--note-size",b.dataset.noteSize);document.querySelectorAll("[data-note-size]").forEach(x=>x.classList.toggle("primary",x===b))});$("startBtn").onclick=start;$("pauseBtn").onclick=()=>running=false;$("resetBtn").onclick=()=>{running=false;elapsed=0;$("stage").className="stage glass"};setMode("clock");tick();
</script>
</body>
</html>
